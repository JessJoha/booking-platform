name: Deploy UserManagement Microservices

on:
  push:
    branches:
      - test

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_PASSWORD}}

      - name: Build and push images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME}}/login-auth:v1 ./backend/User_Management/login_auth
          docker build -t ${{ secrets.DOCKERHUB_USERNAME}}/recovery-password:v1 ./backend/User_Management/recoveryPassword
          docker build -t ${{ secrets.DOCKERHUB_USERNAME}}/register-user:v1 ./backend/User_Management/registerUser
          docker build -t ${{ secrets.DOCKERHUB_USERNAME}}/userprofileservice:v5 ./backend/User_Management/userProfiles

          docker push ${{ secrets.DOCKERHUB_USERNAME}}/login-auth:v1
          docker push ${{ secrets.DOCKERHUB_USERNAME}}/recovery-password:v1
          docker push ${{ secrets.DOCKERHUB_USERNAME}}/register-user:v1
          docker push ${{ secrets.DOCKERHUB_USERNAME}}/userprofileservice:v5

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy UserManagement to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_DNS_USERS}}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY_USERS}}
          script: |
            
          
            if ! command -v docker &> /dev/null
            then
              sudo apt update
              sudo apt install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ubuntu
            fi

            # Detener y eliminar contenedores antiguos
            sudo docker stop create-reservation delete-reservation list-reservation update-reservation || true
            sudo docker rm create-reservation delete-reservation list-reservation update-reservation || true

            # Descargar imágenes actualizadas
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME}}/create-reservation:v1
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME}}/delete-reservation:v1
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME}}/list-reservation:v1
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME}}/update-reservation:v1

            # Ejecutar contenedores con MySQL en AWS y puertos asignados
            sudo docker run -d --name create-reservation -p 6000:6000 \
            -e DB_URL="${{ secrets.DB_URL_MYSQL }}" \
            -e DB_USERNAME="${{ secrets.DB_USERNAME_MYSQL }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD_MYSQL }}" \
            ${{ secrets.DOCKERHUB_USERNAME}}/create-reservation:v1

            sudo docker run -d --name delete-reservation -p 6001:6001 \
            -e DB_URL="${{ secrets.DB_URL_MYSQL }}" \
            -e DB_USERNAME="${{ secrets.DB_USERNAME_MYSQL }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD_MYSQL }}" \
            ${{ secrets.DOCKERHUB_USERNAME}}/delete-reservation:v1

            sudo docker run -d --name list-reservation -p 6002:6002 \
            -e DB_URL="${{ secrets.DB_URL_MYSQL }}" \
            -e DB_USERNAME="${{ secrets.DB_USERNAME_MYSQL }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD_MYSQL }}" \
            ${{ secrets.DOCKERHUB_USERNAME}}/list-reservation:v1

            sudo docker run -d --name update-reservation -p 6003:6003 \
            -e DB_URL="${{ secrets.DB_URL_MYSQL }}" \
            -e DB_USERNAME="${{ secrets.DB_USERNAME_MYSQL }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD_MYSQL }}" \
            ${{ secrets.DOCKERHUB_USERNAME}}/update-reservation:v1