name: Deploy SpaceManagement Microservices

on:
  push:
    branches:
      - test

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push space images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/create-space:v1 ./backend/space_management/createSpace
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/delete-space:v1 ./backend/space_management/deleteSpace
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/update-space:v1 ./backend/space_management/updateSpace

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/create-space:v1
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/delete-space:v1
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/update-space:v1

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy SpaceManagement to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_DNS_SPACE }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY_SPACE }}
          script: |
            if ! command -v docker &> /dev/null
            then
              sudo apt update
              sudo apt install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ubuntu
            fi

            # Detener y eliminar contenedores anteriores si existen
            sudo docker stop create-space delete-space update-space || true
            sudo docker rm create-space delete-space update-space || true

            # Descargar las últimas imágenes desde DockerHub
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/create-space:v1
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/delete-space:v1
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/update-space:v1

            # Ejecutar contenedores con variables de entorno necesarias
            sudo docker run -d --name create-space -p 3008:3008 \
            -e DB_USER="${{ secrets.DB_USER_MYSQL_SPACE  }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD_MYSQL_SPACE  }}" \
            -e DB_HOST="${{ secrets.DB_HOST_MYSQL_SPACE }}" \
            -e DB_PORT="${{ secrets.DB_PORT_MYSQL_SPACE }}" \
            -e DB_NAME="${{ secrets.DB_NAME_MYSQL_SPACE }}" \
            ${{ secrets.DOCKERHUB_USERNAME }}/create-space:v1

            sudo docker run -d --name delete-space -p 3012:3012 \
            -e DB_USER="${{ secrets.DB_USER_MYSQL_SPACE  }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD_MYSQL_SPACE  }}" \
            -e DB_HOST="${{ secrets.DB_HOST_MYSQL_SPACE }}" \
            -e DB_PORT="${{ secrets.DB_PORT_MYSQL_SPACE  }}" \
            -e DB_NAME="${{ secrets.DB_NAME_MYSQL_SPACE  }}" \
            ${{ secrets.DOCKERHUB_USERNAME }}/delete-space:v1

            sudo docker run -d --name update-space -p 3011:3011 \
            -e DB_USER="${{ secrets.DB_USER_MYSQL_SPACE }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD_MYSQL_SPACE }}" \
            -e DB_HOST="${{ secrets.DB_HOST_MYSQL_SPACE  }}" \
            -e DB_PORT="${{ secrets.DB_PORT_MYSQL_SPACE }}" \
            -e DB_NAME="${{ secrets.DB_NAME_MYSQL_SPACE  }}" \
            ${{ secrets.DOCKERHUB_USERNAME }}/update-space:v1
