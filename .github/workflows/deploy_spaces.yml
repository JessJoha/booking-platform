name: Deploy SpaceManagement Microservices

on:
  push:
    branches:
      - test
    paths:
      - 'backend/space_management/**'
      - '.github/workflows/deploy_spacemanagement.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Run unit tests for SpaceManagement
        run: |
          # createSpace
          go test ./backend/space_management/createSpace/tests

          # deleteSpace
          go test ./backend/space_management/deleteSpace/tests

          # updateSpace
          go test ./backend/space_management/updateSpace/tests

          # listSpace
          go test ./backend/space_management/listSpace/tests

      - name: Detect changed microservices
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            createSpace: backend/space_management/createSpace/**
            deleteSpace: backend/space_management/deleteSpace/**
            updateSpace: backend/space_management/updateSpace/**
            listSpace: backend/space_management/listSpace/**

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Clean old Docker containers and images
        run: |
          docker stop create-space || true && docker rm create-space || true
          docker stop delete-space || true && docker rm delete-space || true
          docker stop update-space || true && docker rm update-space || true
          docker stop list-space || true && docker rm list-space || true
          docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/create-space:v1 || true
          docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/delete-space:v1 || true
          docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/update-space:v1 || true
          docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/list-space:v1 || true

      - name: Build and push updated SpaceManagement images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/create-space:v1 ./backend/space_management/createSpace
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/create-space:v1

          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/delete-space:v1 ./backend/space_management/deleteSpace
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/delete-space:v1

          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/update-space:v1 ./backend/space_management/updateSpace
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/update-space:v1

          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/list-space:v1 ./backend/space_management/listSpace
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/list-space:v1

      - name: Deploy SpaceManagement to AWS EC2
        if: success()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_DNS_SPACE }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY_SPACE }}
          script: |
            sudo apt update && sudo apt install -y docker.io || true
            sudo systemctl start docker
            sudo docker system prune -af

            # CREATE SPACE
            if [[ "${{ steps.changes.outputs.createSpace }}" == 'true' ]]; then
              sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/create-space:v1
              sudo docker stop create-space || true
              sudo docker rm create-space || true
              sudo docker run -d --name create-space -p 3008:3008 \
                -e DB_USER="${{ secrets.DB_USER_MYSQL_SPACE }}" \
                -e DB_PASSWORD="${{ secrets.DB_PASSWORD_MYSQL_SPACE }}" \
                -e DB_HOST="${{ secrets.DB_HOST_MYSQL_SPACE }}" \
                -e DB_PORT="${{ secrets.DB_PORT_MYSQL_SPACE }}" \
                -e DB_NAME="${{ secrets.DB_NAME_MYSQL_SPACE }}" \
                ${{ secrets.DOCKERHUB_USERNAME }}/create-space:v1
            fi

            # DELETE SPACE
            if [[ "${{ steps.changes.outputs.deleteSpace }}" == 'true' ]]; then
              sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/delete-space:v1
              sudo docker stop delete-space || true
              sudo docker rm delete-space || true
              sudo docker run -d --name delete-space -p 3012:3012 \
                -e DB_USER="${{ secrets.DB_USER_MYSQL_SPACE }}" \
                -e DB_PASSWORD="${{ secrets.DB_PASSWORD_MYSQL_SPACE }}" \
                -e DB_HOST="${{ secrets.DB_HOST_MYSQL_SPACE }}" \
                -e DB_PORT="${{ secrets.DB_PORT_MYSQL_SPACE }}" \
                -e DB_NAME="${{ secrets.DB_NAME_MYSQL_SPACE }}" \
                ${{ secrets.DOCKERHUB_USERNAME }}/delete-space:v1
            fi

            # UPDATE SPACE
            if [[ "${{ steps.changes.outputs.updateSpace }}" == 'true' ]]; then
              sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/update-space:v1
              sudo docker stop update-space || true
              sudo docker rm update-space || true
              sudo docker run -d --name update-space -p 3011:3011 \
                -e DB_USER="${{ secrets.DB_USER_MYSQL_SPACE }}" \
                -e DB_PASSWORD="${{ secrets.DB_PASSWORD_MYSQL_SPACE }}" \
                -e DB_HOST="${{ secrets.DB_HOST_MYSQL_SPACE }}" \
                -e DB_PORT="${{ secrets.DB_PORT_MYSQL_SPACE }}" \
                -e DB_NAME="${{ secrets.DB_NAME_MYSQL_SPACE }}" \
                ${{ secrets.DOCKERHUB_USERNAME }}/update-space:v1
            fi

            # LIST SPACE
            if [[ "${{ steps.changes.outputs.listSpace }}" == 'true' ]]; then
              sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/list-space:v1
              sudo docker stop list-space || true
              sudo docker rm list-space || true
              sudo docker run -d --name list-space -p 3010:3010 \
                -e DB_USER="${{ secrets.DB_USER_MYSQL_SPACE }}" \
                -e DB_PASSWORD="${{ secrets.DB_PASSWORD_MYSQL_SPACE }}" \
                -e DB_HOST="${{ secrets.DB_HOST_MYSQL_SPACE }}" \
                -e DB_PORT="${{ secrets.DB_PORT_MYSQL_SPACE }}" \
                -e DB_NAME="${{ secrets.DB_NAME_MYSQL_SPACE }}" \
                ${{ secrets.DOCKERHUB_USERNAME }}/list-space:v1
            fi
