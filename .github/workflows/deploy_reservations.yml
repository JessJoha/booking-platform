name: Deploy ReservationManagement Microservices

on:
  push:
    branches:
      - test
    paths:
      - 'backend/reservation_management/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Detect changed microservices
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            createReservation: backend/reservation_management/createReservation/**
            deleteReservation: backend/reservation_management/deleteReservation/**
            listReservation: backend/reservation_management/listReservation/**
            updateReservation: backend/reservation_management/updateReservation/**

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Deploy ReservationManagement to AWS EC2
        if: success()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_DNS_RESERVATION }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY_RESERVATION }}
          script: |
            sudo apt update && sudo apt install -y docker.io || true
            sudo systemctl start docker
            sudo docker system prune -af

            # CREATE RESERVATION
            if [[ "${{ steps.changes.outputs.createReservation }}" == 'true' ]]; then
              sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/create-reservation:v1
              sudo docker stop create-reservation || true
              sudo docker rm create-reservation || true
              sudo docker run -d --name create-reservation -p 3001:3001 \
                -e DB_HOST="${{ secrets.DB_HOST_POSTGRES }}" \
                -e DB_USERNAME="${{ secrets.DB_USERNAME_POSTGRES }}" \
                -e DB_PASSWORD="${{ secrets.DB_PASSWORD_POSTGRES }}" \
                ${{ secrets.DOCKERHUB_USERNAME }}/create-reservation:v1
            fi

            # DELETE RESERVATION
            if [[ "${{ steps.changes.outputs.deleteReservation }}" == 'true' ]]; then
              sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/delete-reservation:v1
              sudo docker stop delete-reservation || true
              sudo docker rm delete-reservation || true
              sudo docker run -d --name delete-reservation -p 3002:3002 \
                -e DB_HOST="${{ secrets.DB_HOST_POSTGRES }}" \
                -e DB_USERNAME="${{ secrets.DB_USERNAME_POSTGRES }}" \
                -e DB_PASSWORD="${{ secrets.DB_PASSWORD_POSTGRES }}" \
                ${{ secrets.DOCKERHUB_USERNAME }}/delete-reservation:v1
            fi

            # LIST RESERVATION
            if [[ "${{ steps.changes.outputs.listReservation }}" == 'true' ]]; then
              sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/list-reservation:v1
              sudo docker stop list-reservation || true
              sudo docker rm list-reservation || true
              sudo docker run -d --name list-reservation -p 3004:3004 \
                -e DB_HOST="${{ secrets.DB_HOST_POSTGRES}}" \
                -e DB_USERNAME="${{ secrets.DB_USERNAME_POSTGRES }}" \
                -e DB_PASSWORD="${{ secrets.DB_PASSWORD_POSTGRES }}" \
                ${{ secrets.DOCKERHUB_USERNAME }}/list-reservation:v1
            fi

            # UPDATE RESERVATION
            if [[ "${{ steps.changes.outputs.updateReservation }}" == 'true' ]]; then
              sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/update-reservation:v1
              sudo docker stop update-reservation || true
              sudo docker rm update-reservation || true
              sudo docker run -d --name update-reservation -p 3003:3003 \
                -e DB_HOST="${{ secrets.DB_HOST_POSTGRES }}" \
                -e DB_USERNAME="${{ secrets.DB_USERNAME_POSTGRES }}" \
                -e DB_PASSWORD="${{ secrets.DB_PASSWORD_POSTGRES }}" \
                ${{ secrets.DOCKERHUB_USERNAME }}/update-reservation:v1
            fi
